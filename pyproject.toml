[build-system]
# 77+ for PEP 639: `license` as an SPDX expression and `license-files`, so the
# licence travels in the wheel instead of only in the repository.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "np2hw"
version = "0.3.0"
description = "NumPy -> streaming hardware (Verilog) compiler for image and 2-D pipelines"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Serge Rabyking" }]
requires-python = ">=3.9"
keywords = ["verilog", "rtl", "hls", "numpy", "isp", "fpga", "eda", "compiler"]
# No `License ::` classifiers: PEP 639 says the `license` expression above is
# the declaration, and stating it twice is how the two come to disagree.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Embedded Systems",
]
dependencies = ["numpy"]

[project.optional-dependencies]
media = ["pillow"]            # CLI image/GIF IO
camera = ["opencv-python"]    # `np2hw view --source camera` (webcam)
switchboard = ["switchboard-hw", "umi"]   # `np2hw run --backend switchboard`
fusesoc = ["PyYAML"]          # generator-protocol input parsing (FuseSoC ships it too)

[project.urls]
Homepage = "https://github.com/lanserge/np2hw"
Source = "https://github.com/lanserge/np2hw"
Issues = "https://github.com/lanserge/np2hw/issues"

[project.scripts]
np2hw = "np2hw.cli:main"
np2hw-fusesoc = "np2hw.fusesoc:main"

[tool.setuptools.packages.find]
where = ["src"]
